name: CI - Test & Build Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: TypeScript Quality, Unit Tests & Build (API & Web)
  # -------------------------------------------------------------
  test-and-build-typescript:
    name: Lint, Test & Build (NestJS API & Next.js Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Code Style (Prettier)
        run: pnpm run format:check

      - name: Run Monorepo Linter (Turbo + ESLint + Oxlint)
        run: pnpm run lint

      - name: Generate Prisma Client
        run: pnpm --filter api run prisma:generate

      - name: Run Backend Tests (Vitest)
        run: pnpm --filter api run test

      - name: Build Monorepo Applications (API & Web)
        run: pnpm run build

  # -------------------------------------------------------------
  # Job 2: Python AI Service Verification & Unit Tests
  # -------------------------------------------------------------
  test-ai-service:
    name: Verify AI Service (Python 3.12, FastAPI & pgvector)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ai-service/requirements.txt
          pip install flake8 pytest pytest-asyncio

      - name: Lint Python Code
        run: |
          flake8 apps/ai-service/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Verify Application Imports
        run: |
          python -c "from app.main import app; print('FastAPI app imported successfully!')"
        working-directory: apps/ai-service

  # -------------------------------------------------------------
  # Job 3: Docker Build Cache Validation
  # -------------------------------------------------------------
  validate-docker-builds:
    name: Validate Production Dockerfiles
    runs-on: ubuntu-latest
    needs: [test-and-build-typescript, test-ai-service]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AI Service Container
        uses: docker/build-push-action@v5
        with:
          context: apps/ai-service
          file: apps/ai-service/Dockerfile
          push: false
          tags: dokanos-ai:ci-test

      - name: Build API Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: dokanos-api:ci-test

      - name: Build Web Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: dokanos-web:ci-test
