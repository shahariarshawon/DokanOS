name: CD - Production VPS Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Publish Container Images to GHCR
  # -------------------------------------------------------------
  build-and-push:
    name: Build & Push Production Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & Push NestJS Core API
      - name: Build and Push Backend API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push Next.js Frontend
      - name: Build and Push Frontend Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push FastAPI AI Service
      - name: Build and Push AI Service Image
        uses: docker/build-push-action@v5
        with:
          context: apps/ai-service
          file: apps/ai-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ai:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # Job 2: Deploy to Production VPS
  # -------------------------------------------------------------
  deploy-vps:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: [build-and-push]

    steps:
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            echo "=== DokanOS Production Deployment Started ==="
            cd /opt/dokanos

            # 1. Authenticate with GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # 2. Pull latest container images
            echo "Pulling latest production images..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:latest
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ai:latest

            # 3. Execute Database Migrations against NeonDB
            echo "Running Prisma database migrations..."
            docker run --rm \
              --env-file /opt/dokanos/apps/api/.env \
              ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest \
              npx prisma migrate deploy

            # 4. Rolling zero-downtime container restart
            echo "Restarting service stack..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # 5. Clean dangling Docker images
            docker image prune -af --filter "until=72h"

            # 6. Verify Health Endpoint
            echo "Verifying deployment health..."
            sleep 10
            curl -f http://127.0.0.1:4000/api/v1/health || (echo "Healthcheck failed!" && exit 1)

            echo "=== DokanOS Successfully Deployed to Production! ==="
