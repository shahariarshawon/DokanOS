services:
  postgres:
    image: postgres:16
    container_name: dokanos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dokanos
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dokanos
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: dokanos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: