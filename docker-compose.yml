services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dokanos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dokanos
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dokanos
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dokanos -d dokanos"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dokanos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: